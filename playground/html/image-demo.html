<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EosImage 组件示例</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    
    .demo-section {
      background: white;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h2 {
      color: #333;
      margin-bottom: 20px;
    }
    
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    
    .demo-item {
      text-align: center;
    }
    
    .demo-item h3 {
      font-size: 14px;
      color: #666;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>EosImage 组件示例</h1>
  
  <div class="demo-section">
    <h2>基本用法</h2>
    <div class="demo-grid">
      <div class="demo-item">
        <h3>默认加载</h3>
        <e-image 
          src="https://picsum.photos/200/200?random=1" 
          alt="示例图片"
          width="200"
          height="200">
        </e-image>
      </div>
      
      <div class="demo-item">
        <h3>字符串尺寸（带单位）</h3>
        <e-image 
          src="https://picsum.photos/200/200?random=2" 
          alt="带单位尺寸"
          width="10rem"
          height="10rem">
        </e-image>
      </div>
      
      <div class="demo-item">
        <h3>加载失败</h3>
        <e-image 
          src="https://invalid-url.com/image.jpg" 
          alt="加载失败"
          width="200"
          height="200">
        </e-image>
      </div>
      
      <div class="demo-item">
        <h3>圆形图片</h3>
        <e-image 
          src="https://picsum.photos/200/200?random=3" 
          alt="圆形图片"
          circle
          width="200"
          height="200">
        </e-image>
      </div>
    </div>
  </div>
  
  <div class="demo-section">
    <h2>Object-fit 模式</h2>
    <div class="demo-grid">
      <div class="demo-item">
        <h3>Cover</h3>
        <e-image 
          src="https://picsum.photos/300/200?random=4" 
          object-fit="cover"
          width="200"
          height="200">
        </e-image>
      </div>
      
      <div class="demo-item">
        <h3>Contain</h3>
        <e-image 
          src="https://picsum.photos/300/200?random=5" 
          object-fit="contain"
          width="200"
          height="200">
        </e-image>
      </div>
      
      <div class="demo-item">
        <h3>Fill</h3>
        <e-image 
          src="https://picsum.photos/300/200?random=6" 
          object-fit="fill"
          width="200"
          height="200">
        </e-image>
      </div>
    </div>
  </div>
  
  <script type="module">
    // 从本地开发环境导入
    import { registerComponents } from '../../packages/components/dist/index.js';

    
    // 注册组件
    registerComponents();
    
    // 监听事件示例
    document.querySelectorAll('e-image').forEach(img => {
      img.addEventListener('load', (e) => {
        console.log('图片加载成功:', e.detail.src);
      });
      
      img.addEventListener('error', (e) => {
        console.log('图片加载失败:', e.detail.src);
      });
    });
  </script>
</body>
</html>
